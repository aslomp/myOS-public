<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="900" viewBox="0 0 1560 900"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#61728a"/></marker></defs><rect width="1560" height="900" fill="#f5f7fb"/><rect x="0" y="0" width="1560" height="112" fill="#101e34"/><text x="65" y="56" font-family="Arial,sans-serif" font-weight="bold" font-size="35" fill="#ffffff">myOS: STORAGE AND ASYNCHRONOUS I/O</text><text x="65" y="88" font-family="Arial,sans-serif" font-size="19" fill="#c8d6ec">Filesystem semantics, shared file identities and device execution are separated.</text><rect x="50" y="146" width="355" height="637" rx="18" fill="#fff" stroke="#dbe2ec" stroke-width="2"/><rect x="50" y="146" width="355" height="65" rx="18" fill="#285d9c"/><rect x="50" y="194" width="355" height="17" fill="#285d9c"/><text x="70" y="188" font-family="Arial" font-weight="bold" font-size="23" fill="white">Callers</text><rect x="67" y="240" width="320" height="96" rx="12" fill="#e5efff" stroke="#285d9c" stroke-opacity=".3" stroke-width="1.5"/><text x="81" y="272" font-family="Arial" font-size="20" font-weight="bold" fill="#285d9c">Linux applications</text><text x="81" y="294" font-family="Arial" font-size="16" fill="#3d4b60">Paths and file descriptors</text><text x="81" y="315" font-family="Arial" font-size="16" fill="#3d4b60">Mount views</text><rect x="67" y="364" width="320" height="96" rx="12" fill="#e5efff" stroke="#285d9c" stroke-opacity=".3" stroke-width="1.5"/><text x="81" y="396" font-family="Arial" font-size="20" font-weight="bold" fill="#285d9c">Windows applications</text><text x="81" y="418" font-family="Arial" font-size="16" fill="#3d4b60">NT names and handles</text><text x="81" y="439" font-family="Arial" font-size="16" fill="#3d4b60">NT file contracts</text><rect x="67" y="488" width="320" height="96" rx="12" fill="#e5efff" stroke="#285d9c" stroke-opacity=".3" stroke