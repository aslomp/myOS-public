amily="Arial" font-size="16" fill="#3d4b60">PCI and controller</text><text x="1221" y="439" font-family="Arial" font-size="16" fill="#3d4b60">IOMMU group</text><rect x="1207" y="488" width="320" height="96" rx="12" fill="#f0eafc" stroke="#69499f" stroke-opacity=".3" stroke-width="1.5"/><text x="1221" y="520" font-family="Arial" font-size="20" font-weight="bold" fill="#69499f">Image device</text><text x="1221" y="542" font-family="Arial" font-size="16" fill="#3d4b60">File-backed partitions</text><text x="1221" y="563" font-family="Arial" font-size="16" fill="#3d4b60">Android images</text><rect x="1207" y="612" width="320" height="96" rx="12" fill="#f0eafc" stroke="#69499f" stroke-opacity=".3" stroke-width="1.5"/><text x="1221" y="644" font-family="Arial" font-size="20" font-weight="bold" fill="#69499f">Reliability</text><text x="1221" y="666" font-family="Arial" font-size="16" fill="#3d4b60">Flush / metadata / power</text><text x="1221" y="687" font-family="Arial" font-size="16" fill="#3d4b60">Explicit verification</text><path d="M 405 250 C 417.5 250, 417.5 250, 430 250" fill="none" stroke="#61728a" stroke-width="3" marker-end="url(#arr)"/><path d="M 785 370 C 797.5 370, 797.5 370, 810 370" fill="none" stroke="#61728a" stroke-width="3" marker-end="url(#arr)"/><path d="M 1165 490 C 1177.5 490, 1177.5 490, 1190 490" fill="none" stroke="#61728a" stroke-width="3" marker-end="url(#arr)"/><rect x="50" y="808" width="1460" height="65" rx="10" fill="#e5eaf2"/><text x="72" y="846" font-family="Arial" font-size="19" fill="#344560">Not all filesystems and personalities currently provide identical semantics or performance.</text></svg>